<!doctype html>
<html lang="en" data-theme="school">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official website of South Dhaka Pre-Cadet School — school introduction, notice board and online admission." />
    <meta name="theme-color" content="#0b1f3a" />
    <title>South Dhaka Pre-Cadet School</title>
    <script>
      // Applies the saved or system theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var saved = localStorage.getItem('sms.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'schooldark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#071628');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
